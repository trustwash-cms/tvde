services:
  postgres:
    image: postgres:16-alpine
    container_name: tvde_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvde
      POSTGRES_PASSWORD: tvde_secret
      POSTGRES_DB: tvde
    ports:
      - "5433:5432"
    volumes:
      - tvde_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvde -d tvde"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tvde_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - tvde_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tvde_postgres_data:
  tvde_redis_data:
